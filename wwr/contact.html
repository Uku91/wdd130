<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Adventures</title>
    <meta name="description"
      content="Contact White Water Rafting Adventures to book an adventure, ask questions, or plan a company outing. You can reach us by phone, email, or contact form on our website.">
    <meta name="author" content="Undu Abraham Ukuma">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="sit-logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>White Water Rafting Adventures</h1>
        <!--Company information-->
        <section class="contact-info">
            <div class="company-details">
                <address>
                    <p>123 Manin River Street</p>
                    <p>Kolob, California</p>
                    <p><a href="tel:+1999 999 9999">+1 999 999 9999</a> </p>
                    <p><a href="mailto:info@wwaterrafting.com">info@wwaterrafting.com</a></p>
                </address>
            </div>
        </section>
        <!--Map and contact form section-->
        <section class="map-and-form">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2800.123456789!2d-114.123456789!3d45.123456789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDXCsDA3JzI0LjQiTiAxMTTCsDA3JzI0LjQiVw!5e0!3m2!1sen!2sus!4v1234567890"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                  title="Map showing White Water Rafting Adventure location">
                </iframe>
            </div>
            <!--Contact form section-->
            <section class="contact-form-section">
                <h2>Send Us a Message</h2>
                <form action="#" method="post" class="contact-form">
                    <!---contact name-->
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                        <input type="email" id="email" name="email" placeholder="Enter your Email"
                          required>
                    </div>
                    <!---Select purpose-->
                    <fieldset class="form-group">
                        <legend>Purpose of Message:</legend>
                        <div class="radio-group">
                            <label>
                                <input type="radio" id="general" name="purpose" value="General"
                                  checked>General
                                Enquiry</label>
                            <label>
                                <input type="radio" id="reservation" name="purpose"
                                  value="suggestion">Reservation Question</label>
                            <label><input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">Website
                                Suggestion</label>
                        </div>
                    </fieldset>
                    <!--Message-->
                    <div class="form-message">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" rows="5"
                          placeholder="Type your message here..." required></textarea>
                    </div>
                    <!---Newsletter checkbox-->
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                            Please subscribe me to monthly newsletter
                        </label>
                    </div>
                    <!--Submit button-->
                    <div class="form-group">
                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
            </section>

            <!--Employee Profiles section-->
            <section class="employees">
                <h2>We Are Here To Serve You</h2>
                <div class="employee-grid">
                    <figure>
                        <img src="images/sarah-paul.jpg" alt="sarah paul, Lead River Guide">
                        <figcaption> Sarah Paul <span>Lead River Guid</span></figcaption>
                    </figure>
                    <figure>
                        <img src="images/mike-chen.jpg"
                          alt="mike chen, Customer Experience Coordinator">
                        <figcaption>Mike Chen <span>Customer Experience Coordinator</span>
                        </figcaption>
                    </figure>
                    <figure>
                        <img src="images/john-keneth.jpg" alt="john keneth, Operations Manager">
                        <figcaption>John Keneth<span>Operations Manager</span></figcaption>
                    </figure>
                </div>
            </section>

    </main>

    <footer>
        <p>©2026💻 White Water Rafting Adventures 💻Undu Abraham Ukuma</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com/undua1"><img src="images/facebook.png"
                  alt="facebook"></a>
            <a href="https://www.linkedin.com/in/undu-abraham-274bb61a1"><img
                  src="images/linkedin.png" alt="linkedin"></a>
            <a href="https://www.instagram.com/abrahamundu"><img src="images/instagram.png"
                  alt="whatsapp"></a>
        </nav>
    </footer>
</body>

</html>
